<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Call Dashboard</title>

<style>
body{
    font-family: Arial;
    background:#f5f7fb;
    color:#111;
    padding:20px;
}

.controls{
    margin-bottom:15px;
}

input, select{
    padding:8px;
    margin-right:10px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    padding:8px 12px;
    border:none;
    border-radius:6px;
    background:#2563eb;
    color:#fff;
    cursor:pointer;
}

/* ===== STATS ===== */
.stats{
    display:flex;
    gap:15px;
    margin-bottom:20px;
}

.card{
    flex:1;
    background:#fff;
    padding:15px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
    text-align:center;
}

.card h3{
    margin:0;
    font-size:14px;
    color:#888;
}

.card p{
    font-size:24px;
    font-weight:bold;
}

.card.total{border-top:4px solid #2563eb;}
.card.in{border-top:4px solid #16a34a;}
.card.out{border-top:4px solid #f59e0b;}
.card.miss{border-top:4px solid #ef4444;}

/* ===== TABLE ===== */
table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
}

th, td{
    padding:10px;
    text-align:center;
}

th{
    background:#2563eb;
    color:#fff;
    position:sticky;
    top:0;
}

tbody tr{
    border-bottom:1px solid #eee;
}

tbody tr:nth-child(even){
    background:#f9fbff;
}

tbody tr:hover{
    background:#eaf2ff;
}
</style>
</head>

<body>

<h2>📞 CUỘC GỌI XỬ LÝ ĐƠN</h2>

<div class="controls">
    🔍 <input type="text" id="search" placeholder="Tìm số">
    📅 <input type="date" id="dateFilter">
    
    <select id="typeFilter">
        <option value="">Tất cả</option>
        <option value="Gọi đến">Gọi đến</option>
        <option value="Gọi đi">Gọi đi</option>
        <option value="Gọi nhỡ">Gọi nhỡ</option>
    </select>

    <button onclick="exportExcel()">📊 Export</button>
</div>

<div class="stats">
    <div class="card total"><h3>Tổng</h3><p id="total">0</p></div>
    <div class="card in"><h3>Gọi đến</h3><p id="in">0</p></div>
    <div class="card out"><h3>Gọi đi</h3><p id="out">0</p></div>
    <div class="card miss"><h3>Gọi nhỡ</h3><p id="miss">0</p></div>
</div>

<table>
<thead>
<tr>
<th>STT</th>
<th>SĐT</th>
<th>Loại</th>
<th>Talk</th>
<th>Ring</th>
<th>Thời gian</th>
</tr>
</thead>
<tbody id="data"></tbody>
</table>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

// ===== TIME VN =====
function getTodayVN(){
    const now = new Date();
    return new Date(now.getTime() - now.getTimezoneOffset()*60000)
        .toISOString().split("T")[0];
}

document.getElementById("dateFilter").value = getTodayVN();

// ===== FIREBASE =====
const firebaseConfig = {
  databaseURL: "https://call1803-default-rtdb.asia-southeast1.firebasedatabase.app/"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let allData = [];
let filteredData = [];

db.ref("calls").on("value", snapshot => {
    const data = snapshot.val();
    let temp = [];

    for(let d in data){
        for(let dev in data[d]){
            for(let id in data[d][dev]){
                temp.push(data[d][dev][id]);
            }
        }
    }

    const map = new Map();
    temp.forEach(i=>{
        const key=(i.number||"")+(i.time||"");
        if(!map.has(key)) map.set(key,i);
    });

    allData = Array.from(map.values());

    render();
});

// ===== DATE FILTER =====
function isSameDate(timeStr, inputDate){
    if(!timeStr) return false;

    const parts = timeStr.split(" ")[1].split("/");
    const d = new Date(parts[2], parts[1]-1, parts[0]);
    const selected = new Date(inputDate);

    return d.getFullYear() === selected.getFullYear() &&
           d.getMonth() === selected.getMonth() &&
           d.getDate() === selected.getDate();
}

// ===== RENDER =====
function render(){

    const s = document.getElementById("search").value.toLowerCase();
    const df = document.getElementById("dateFilter").value;
    const tf = document.getElementById("typeFilter").value;

    let html="";
    let stt=1;

    let total=0, incoming=0, outgoing=0, missed=0;

    filteredData = [];

    allData.forEach(i=>{

        const talk = i.talkTime ?? i.duration ?? 0;
        const ring = i.ringTime ?? 0;

        if(s && !(i.number||"").toLowerCase().includes(s)) return;
        if(df && !isSameDate(i.time, df)) return;
        if(tf && i.type !== tf) return;

        filteredData.push(i);

        total++;

        if(i.type==="Gọi đến") incoming++;
        else if(i.type==="Gọi đi") outgoing++;
        else if(i.type==="Gọi nhỡ") missed++;

        html+=`
        <tr>
        <td>${stt++}</td>
        <td>${i.number||""}</td>
        <td>${i.type||""}</td>
        <td>${talk}s</td>
        <td>${ring}s</td>
        <td>${i.time||""}</td>
        </tr>`;
    });

    document.getElementById("data").innerHTML=html;

    document.getElementById("total").innerText = total;
    document.getElementById("in").innerText = incoming;
    document.getElementById("out").innerText = outgoing;
    document.getElementById("miss").innerText = missed;
}

// ===== EVENT =====
document.getElementById("search").addEventListener("input",render);
document.getElementById("dateFilter").addEventListener("change",render);
document.getElementById("typeFilter").addEventListener("change",render);

// ===== EXPORT =====
function exportExcel(){
    let csv="\uFEFFSTT,SĐT,Loại,Talk,Ring,Thời gian\n";
    let stt=1;

    filteredData.forEach(i=>{
        const talk = i.talkTime ?? i.duration ?? 0;
        const ring = i.ringTime ?? 0;

        csv+=`${stt++},${i.number||""},${i.type||""},${talk},${ring},${i.time||""}\n`;
    });

    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);

    const type = document.getElementById("typeFilter").value || "all";
    a.download=`calls_${type}.csv`;

    a.click();
}

</script>

</body>
</html>
